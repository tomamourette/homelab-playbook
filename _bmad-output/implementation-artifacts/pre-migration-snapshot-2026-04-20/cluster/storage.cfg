dir: local
	path /var/lib/vz
	content backup,vztmpl,iso

lvmthin: local-lvm
	thinpool data
	vgname pve
	content images,rootdir

zfspool: local-zfs
	pool rpool/data
	content rootdir,images
	mountpoint /rpool/data

nfs: shared-nfs
	export /shared-pool/nfs
	path /mnt/pve/shared-nfs
	server 192.168.50.203
	content rootdir,images

pbs: pbs-migration
	datastore migration-window
	server 192.168.50.155
	content backup
	fingerprint d2:6e:ee:4f:1d:e8:e3:50:a1:ab:5b:3e:cb:5d:e4:e6:a7:cc:7c:c5:0c:b5:57:66:d4:d0:97:d5:72:f9:82:50
	username root@pam!pve-cluster

