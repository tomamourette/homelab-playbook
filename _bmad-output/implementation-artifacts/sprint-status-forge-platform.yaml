# bi-services.be to that same Pi-hole, so an OFF-LAN tailnet client saw the same NXDOMAIN. The
# public Cloudflare A record was correct and could not, on its own, satisfy fe2-s05 AC4.
# WHY THE OBVIOUS FIX WAS REJECTED: the Terraform-generated
# terraform/envs/homelab/generated/pihole-custom.list already contains forge, but landing it
# DELETES the live hand-added line "192.168.50.194 hermes.bi-services.be" - a running Traefik
# router for the Linear->Hermes webhook that was never entered into Terraform. (The live file is
# bind-mounted from the on-host clone /opt/homelab-apps/stacks/dns-pihole/config/, whose working
# tree is dirty: 45 files.)
# THE MECHANISM USED: an ADDITIVE, Ansible-managed dnsmasq drop-in (05-forge.conf) carrying
#   address=/forge.bi-services.be/192.168.50.167
# delivered into the Pi-hole container, then a DNS reload. The address= form covers the apex AND
# every subdomain in one line, so it satisfies the wildcard decision above at the same time.
# custom.list is NOT touched; hermes is NOT deleted or altered.
# IaC: homelab-infra/ansible/roles/forge-dns + playbooks/forge-dns.yml.
#
# VERIFIED WORKING 2026-09-09 17:16 UTC - and it was NOT working ten minutes earlier, which is the
# part worth carrying forward. At 17:06 UTC the drop-in was on disk (mtime 16:44 UTC) while
# `dig forge.bi-services.be @192.168.50.194` still returned status: NXDOMAIN, because pihole-FTL
# had not restarted since six days BEFORE the file was written. Delivering the file is not the same
# as landing the record: dnsmasq re-reads hosts files on SIGHUP but NEVER re-reads its config
# files, and address= lives in a config file, so only an FTL restart applies this drop-in.
# THE CHECK THAT TELLS THE TWO STATES APART (use this, not the file's existence):
#   docker exec pihole stat -c %y /etc/dnsmasq.d/05-forge.conf          # config written
#   docker exec pihole sh -c 'stat -c %y /proc/$(pidof pihole-FTL)'     # resolver last started
# FTL must have started AFTER the config was written. Current state:
#   conf mtime  2026-09-09 19:09:18 +0200
#   FTL start   2026-09-09 19:09:19 +0200   (1.2 s later - the reload took)
