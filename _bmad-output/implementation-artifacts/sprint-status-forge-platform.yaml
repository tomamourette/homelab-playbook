# INTERNAL DNS - HOW forge.bi-services.be WAS LANDED (2026-09-09), AND WHAT IS OWED:
# =================================================================================
# THE BLOCKER: Pi-hole on ct-docker-01 (192.168.50.194) ships local=/bi-services.be/ in its
